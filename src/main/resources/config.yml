bossRange: 35
bossLimit: 99
bossHealthMultiplier: 1.0
# ============================================================
#  МИНИ-БОССЫ
#  Появляются случайно при добыче блоков. Все параметры ниже
#  можно менять на лету: /bl-admin reload
# ============================================================
miniboss:
  # Главный выключатель. false = мини-боссы не появляются вовсе
  enabled: true
  # Миры, в которых мини-боссы запрещены
  disabledWorlds:
    - MyTownWorld

  # ---- частота появления ----
  # Сколько блоков нужно добыть, чтобы прошла одна попытка спавна
  blockThreshold: 200
  # Шанс успеха этой попытки, % (35 = примерно раз в ~570 блоков)
  spawnChance: 35
  # Шанс, что выпавший мини-босс окажется элитным, %
  eliteChance: 12
  # Пауза после спавна для игрока, секунды (0 = без паузы)
  cooldownSeconds: 120
  # Сколько мини-боссов может быть живо рядом одновременно
  maxNearby: 2
  # Радиус проверки maxNearby, блоки
  nearbyRadius: 64
  # Границы по высоте: вне их мини-боссы не появляются
  minY: -60
  maxY: 320

  # ---- уведомление игроков ----
  announceRadius: 80
  playSpawnSound: true

  # ---- характеристики ----
  # Базовое здоровье обычного и элитного мини-босса (умножается на bossHealthMultiplier)
  baseHealth: 100
  eliteHealth: 300
  # Полоса босса
  barColor: RED
  barStyle: SOLID
  eliteBarColor: PURPLE

  # ---- лут ----
  # Шанс дропа осколка с обычного / элитного мини-босса, %
  dropChance: 3
  eliteDropChance: 15
  # Максимум осколков за дроп с элитного (от 1 до этого числа)
  eliteDropAmountMax: 3

  # ---- поведение ----
  # Крипер-мини-босс взрывается при смерти
  creeperExplodesOnDeath: true

  # ---- зона сражения ----
  # Убирать мини-босса, если рядом долго нет игроков:
  # игрок умер и возродился далеко, телепортировался, вышел из игры
  despawnWhenAlone: true
  # Радиус зоны сражения: в нём игрок видит полосу здоровья и бой считается активным, блоки
  despawnRadius: 48
  # Сколько секунд без игроков рядом — и мини-босс исчезает (без награды)
  despawnDelaySeconds: 120

  # ---- какие типы могут появляться ----
  # enabled: false — тип отключён
  # weight — относительный вес (чем больше, тем чаще)
  types:
    ZOMBIE:
      enabled: true
      weight: 10
    SKELETON:
      enabled: true
      weight: 10
    SPIDER:
      enabled: true
      weight: 10
    CAVE_SPIDER:
      enabled: true
      weight: 10
    CREEPER:
      enabled: true
      weight: 6
    DROWNED:
      enabled: true
      weight: 6
    HUSK:
      enabled: true
      weight: 6
    STRAY:
      enabled: true
      weight: 6
    WITCH:
      enabled: true
      weight: 10
    EVOKER:
      enabled: true
      weight: 8
    RAVAGER:
      enabled: true
      weight: 8
    ENDERMAN:
      enabled: true
      weight: 10
    SHULKER:
      enabled: true
      weight: 6
    VINDICATOR:
      enabled: true
      weight: 8
    PILLAGER:
      enabled: true
      weight: 8
waterLevel: 40
skyLevel: 200
maxKBEnchantLevel: 10
deathNoteConsumeChance: 10
# Ритуалы призыва (BossLand 3.8).
# По умолчанию босс призывается предметом: скрафтил предмет призыва из осколков —
# нажал правую кнопку — босс появился. Ни строить, ни искать биом не нужно.
rituals:
  # true — старый режим: предмет сработает, только если под ногами построена структура
  #        из recipes.yml (кольцо/крест блоков). Руководство покажет эту структуру.
  requireShrine: false
  # true — старый режим: учитывать измерение, биом и высоту, прописанные для босса
  #        (например, Ледяной Титан только в снежных биомах).
  requireBiome: false
update-check:
  enabled: true
  version-url: "https://gist.githubusercontent.com/TwistyLime/334114c49e15e97bcfeea6f724201109/raw/BossLandCurrentVersion.json"
disabledWorlds:
  - MyTownWorld
