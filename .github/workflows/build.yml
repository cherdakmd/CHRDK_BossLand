name: Build plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег существующего релиза, к которому прикрепить jar (пусто — не публиковать)'
        required: false
        default: ''
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Probe resolved API
        continue-on-error: true
        run: |
          {
            mvn -B -ntp -q dependency:copy-dependencies -DincludeScope=provided -DoutputDirectory=api-deps 2>&1 | tail -n 5
            ls -1 api-deps 2>/dev/null || echo "no api-deps"
            API="$(ls api-deps/spigot-api-*.jar 2>/dev/null | head -n1 || true)"
            echo "spigot-api jar: ${API:-none}"
            if [ -n "${API:-}" ]; then
              echo '--- PotionEffectType SLOW/JUMP ---'
              javap -cp "$API" org.bukkit.potion.PotionEffectType 2>&1 | grep -iE 'SLOW|JUMP' || true
              echo '--- piglin entity classes ---'
              jar tf "$API" | grep -iE 'entity/.*(Piglin|PigZombie)' || true
            fi
          } > probe.log 2>&1

      - name: Build with Maven
        id: build
        run: |
          set -o pipefail
          mvn -B -ntp clean package 2>&1 | tee build.log

      - name: Publish log excerpt on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf 'Build failure @ %s\n\n' "$GITHUB_SHA"
            printf '```\n## probe.log\n'
            head -c 3000 probe.log 2>/dev/null || echo 'no probe.log'
            printf '\n\n## build.log (errors)\n'
            grep -E '^\[(ERROR|WARNING)\]' build.log 2>/dev/null | head -n 80 || tail -c 8000 build.log
            printf '```\n'
          } > report.md
          jq -Rs '{body: .}' < report.md \
            | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - >/dev/null

      - name: Collect jar
        run: |
          set -euo pipefail
          JAR="$(ls target/*.jar | grep -v 'original-' | head -n1)"
          BASE="$(basename "$JAR")"          # bossland-2.8-v1.21.5.jar
          NAME="bossland${BASE#bossland-}"   # bossland2.8-v1.21.5.jar
          mkdir -p dist
          cp "$JAR" "dist/$NAME"
          echo "JAR_PATH=dist/$NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Verify jar contents
        run: |
          set -euo pipefail
          jar tf "$JAR_PATH" | grep -E '^com/twistylime/bossLand/BossLand\.class$'
          jar tf "$JAR_PATH" | grep -E '^(plugin|config|lang|recipes)\.yml$'
          jar tf "$JAR_PATH" | grep -E '^org/bstats/' | head -n1
          unzip -p "$JAR_PATH" plugin.yml | sed -n '1,5p'

      - name: Smoke test on Paper 1.21.5
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          cp "$JAR_PATH" smoke/plugins/
          cd smoke
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=4\nspawn-protection=0\nmax-players=2\n' > server.properties

          BUILD="$(curl -fsSL https://api.papermc.io/v2/projects/paper/versions/1.21.5/builds | jq -r '.builds[-1].build')"
          echo "Paper 1.21.5 build ${BUILD}"
          curl -fsSL -o paper.jar \
            "https://api.papermc.io/v2/projects/paper/versions/1.21.5/builds/${BUILD}/downloads/paper-1.21.5-${BUILD}.jar"

          ( sleep 75; echo "stop" ) | timeout 300 java -Xms512M -Xmx1024M -jar paper.jar --nogui > server.log 2>&1 || true

          echo '--- plugin related log lines ---'
          grep -iE 'bossland|Enabling|Disabling|Done \(' server.log | tail -n 40 || tail -n 80 server.log

          grep -q 'Done (' server.log || { echo '::error::server never finished starting'; exit 1; }
          grep -q 'Enabling BossLand' server.log || { echo '::error::BossLand was not enabled'; exit 1; }
          if grep -q 'Disabling BossLand' server.log; then echo '::error::BossLand disabled itself (runtime error)'; exit 1; fi
          if grep -qE 'Could not load .*BossLand|Error occurred while enabling BossLand' server.log; then
            echo '::error::BossLand failed to load'; exit 1
          fi
          echo "smoke test passed"

      - name: Publish build summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf 'Build summary @ %s\n\n```\n' "$GITHUB_SHA"
            ls -l dist 2>/dev/null || echo 'no dist yet'
            sha256sum dist/*.jar 2>/dev/null || true
            printf '\n--- smoke ---\n'
            grep -iE 'bossland|Done \(|what went wrong' smoke/server.log 2>/dev/null | tail -n 30 || echo 'no smoke log'
            printf '```\n'
          } > summary.md
          jq -Rs '{body: .}' < summary.md \
            | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bossland-jar
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Attach jar to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "BossLand $TAG" --notes "Собрано автоматически из $GITHUB_SHA"
          fi
          gh release upload "$TAG" "$JAR_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
