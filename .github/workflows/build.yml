name: Build plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза, к которому прикрепить собранный jar (пусто — только собрать)'
        required: false
        default: ''
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Collect jar
        run: |
          set -euo pipefail
          JAR="$(ls target/*.jar | grep -v 'original-' | head -n1)"
          BASE="$(basename "$JAR")"          # bossland-<version>.jar
          NAME="bossland${BASE#bossland-}"   # bossland<version>.jar
          mkdir -p dist
          cp "$JAR" "dist/$NAME"
          echo "JAR_PATH=dist/$NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Verify jar contents
        run: |
          set -euo pipefail
          jar tf "$JAR_PATH" | grep -E '^com/twistylime/bossLand/BossLand\.class$'
          jar tf "$JAR_PATH" | grep -E '^(plugin|config|lang|recipes)\.yml$'
          jar tf "$JAR_PATH" | grep -E '^org/bstats/' | head -n1
          unzip -p "$JAR_PATH" plugin.yml | sed -n '1,5p'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bossland-jar
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 90

      # Loading the jar in a real server catches runtime problems that a plain compile cannot.
      - name: Smoke test on Paper 1.21.5 (Java 21)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          EXERCISE: '1'
        run: |
          set +e
          out=$(bash .github/scripts/smoke-test.sh paper 1.21.5 "$JAR_PATH" 2>&1); rc=$?
          echo "$out" | tail -n 30
          if [ "$rc" -ne 0 ]; then
            { echo "$out" | grep -E '::error::|САМОПРОВЕРКА|✗|Осколков|mini-bosses|self-test' || true; } | head -n 40 | while IFS= read -r line; do echo "::error::SMOKE-PAPER: $line"; done
            exit 1
          fi

      - name: Set up JDK 25 (needed by Minecraft 26.x)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Smoke test on Purpur 26.3 (Java 25)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          EXERCISE: '1'
        run: |
          set +e
          out=$(bash .github/scripts/smoke-test.sh purpur 26.3 "$JAR_PATH" 2>&1); rc=$?
          echo "$out" | tail -n 30
          if [ "$rc" -ne 0 ]; then
            { echo "$out" | grep -E '::error::|САМОПРОВЕРКА|✗|Осколков|mini-bosses|self-test' || true; } | head -n 40 | while IFS= read -r line; do echo "::error::SMOKE-PURPUR: $line"; done
            exit 1
          fi

      - name: Publish smoke evidence [temp]
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "smoke evidence @ $GITHUB_SHA"
            echo '```'
            echo "== workspace =="
            pwd || true
            ls -la || true
            echo "== где лежат smoke-файлы =="
            find / -maxdepth 6 -name 'smoke-*' -not -path '/proc/*' 2>/dev/null | head -n 20 || true
            for f in smoke-paper.out smoke-purpur.out; do
              echo "== $f =="
              if [ -f "$f" ]; then tail -n 30 "$f"; else echo '(файла нет)'; fi
              echo
            done
            for d in smoke-paper-1.21.5 smoke-purpur-26.3; do
              echo "== $d/server.log =="
              if [ -f "$d/server.log" ]; then
                grep -E 'САМОПРОВЕРКА|Осколков|Exception|Caused by|Done \(|Enabling' "$d/server.log" | head -n 30
              else
                echo '(лога нет)'
              fi
              echo
            done
            echo '```'
          } > ev.md 2>&1 || true
          wc -c ev.md || true
          jq -Rs '{body: .}' < ev.md | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - || true

      - name: Attach jar to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "BossLand $TAG" --notes "Собрано автоматически из $GITHUB_SHA"
          fi
          gh release upload "$TAG" "$JAR_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
