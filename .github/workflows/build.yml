name: Build plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег существующего релиза, к которому прикрепить jar (пусто — не публиковать)'
        required: false
        default: ''
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Collect jar
        run: |
          set -euo pipefail
          JAR="$(ls target/*.jar | grep -v 'original-' | head -n1)"
          BASE="$(basename "$JAR")"          # bossland-2.8-v1.21.5.jar
          NAME="bossland${BASE#bossland-}"   # bossland2.8-v1.21.5.jar
          mkdir -p dist
          cp "$JAR" "dist/$NAME"
          echo "JAR_PATH=dist/$NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Verify jar contents
        run: |
          set -euo pipefail
          jar tf "$JAR_PATH" | grep -E '^com/twistylime/bossLand/BossLand\.class$'
          jar tf "$JAR_PATH" | grep -E '^(plugin|config|lang|recipes)\.yml$'
          jar tf "$JAR_PATH" | grep -E '^org/bstats/' | head -n1
          unzip -p "$JAR_PATH" plugin.yml | sed -n '1,5p'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bossland-jar
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Attach jar to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "BossLand $TAG" --notes "Собрано автоматически из $GITHUB_SHA"
          fi
          gh release upload "$TAG" "$JAR_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
